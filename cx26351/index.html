<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2430">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="26351操行分">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>26351操行分</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<style>
:root{--ink:#1B2430;--muted:#5B6573;--line:#E2E6EB;--line2:#D5DAE1;--bg:#F4F6F8;--card:#FFFFFF;--blue:#1D5FD1;--blue-l:#E8F0FD;--orange:#C2410C;--orange-l:#FDEEE6;--green:#1F7A4D;--radius:12px;
  --font:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.plus{color:var(--blue);font-weight:700}.minus{color:var(--orange);font-weight:700}.mut{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
/* 顶栏 */
.topbar{background:var(--ink);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.topbar h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.5px}
.topbar .sub{font-size:12px;color:#C9D1DB}
.topbar .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:rgba(255,255,255,.12);padding:4px 10px;border-radius:999px;color:#fff;border:0;cursor:pointer}
.pill.warn{background:var(--orange)}
.dot{width:7px;height:7px;border-radius:50%;background:#7FB2FF;display:inline-block}
/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:#fff;cursor:pointer;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#B8C1CC}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
.btn.danger{color:var(--orange);border-color:#F1C6B3}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px;border-radius:8px}
.btn.lg{min-height:52px;font-size:16px;border-radius:12px;padding:0 18px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:#E2E6EB;border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:8px;min-height:34px;padding:0 12px;cursor:pointer;color:var(--muted);font-size:14px}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line2);background:#fff;border-radius:999px;min-height:34px;padding:0 12px;cursor:pointer;font-size:14px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500}
.chip.j{border-color:#BFD3F6;color:var(--blue)}.chip.k{border-color:#F1C6B3;color:var(--orange)}
.chip.j.on{background:var(--blue);border-color:var(--blue);color:#fff}.chip.k.on{background:var(--orange);border-color:var(--orange);color:#fff}
/* 卡片 */
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 10px}
.card h3{font-size:15px;margin:12px 0 8px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.row>.grow{flex:999 1 480px;min-width:0}
.row>.side{flex:1 1 300px;min-width:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .l{font-size:13px;color:var(--muted)}.kpi .v{font-size:28px;font-weight:700;line-height:1.25}.kpi .s{font-size:12px;color:var(--muted)}
.hint{background:var(--blue-l);color:#1F3A66;border-radius:10px;padding:10px 12px;font-size:14px}
.hint.warn{background:var(--orange-l);color:#7A2A08}
.empty{color:var(--muted);text-align:center;padding:28px 10px;font-size:14px}
/* 表单 */
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.inp{height:40px;border:1px solid var(--line2);border-radius:8px;padding:0 10px;background:#fff;color:var(--ink);font-size:15px;min-width:0;width:100%}
textarea.inp{height:auto;padding:8px 10px;min-height:90px}
.inp:focus{outline:2px solid #9CC3FF;outline-offset:0;border-color:var(--blue)}
.inp.big{height:52px;font-size:22px;font-weight:700}
select.inp{padding:0 6px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);cursor:pointer}
.check input{width:18px;height:18px}
.fgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
/* 表格 */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{background:var(--bg);color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;white-space:nowrap;position:sticky;top:0;cursor:default}
.tbl th.sort{cursor:pointer}.tbl th.sort:hover{color:var(--ink)}
.tbl td{padding:8px 10px;border-top:1px solid #EEF0F3;vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}.tbl td.nw{white-space:nowrap}.tbl td.c,.tbl th.c{text-align:center}
.tbl tr.void td{color:#A0A8B3;text-decoration:line-through}
.tbl tr.hl td{background:#FFF8F4}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap}
.tag.b{background:var(--blue-l);color:#1F3A66}.tag.o{background:var(--orange-l);color:#7A2A08}.tag.k{background:var(--ink);color:#fff}
.grade-优{color:var(--blue);font-weight:700}.grade-差{color:var(--orange);font-weight:700}
/* 管理端外壳 */
.shell{display:flex;flex-wrap:wrap;min-height:calc(100vh - 52px)}
.nav{flex:1 1 200px;max-width:100%;background:#fff;border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:8px;text-align:left;border:0;background:transparent;border-radius:8px;padding:10px 12px;cursor:pointer;font-size:15px;color:var(--ink)}
.nav button:hover{background:var(--bg)}
.nav button.on{background:var(--ink);color:#fff;font-weight:700}
.nav .badge{margin-left:auto;background:var(--orange);color:#fff;border-radius:999px;font-size:12px;padding:0 7px;line-height:20px}
.nav .sep{height:1px;background:var(--line);margin:8px 4px}
.main{flex:999 1 560px;min-width:0}
@media (max-width:860px){
  .nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px 8px;gap:4px;flex-basis:100%}
  .nav button{white-space:nowrap;padding:8px 10px;font-size:14px}
  .nav .sep{display:none}
}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-bottom:12px}
.ph h1{font-size:22px;margin:0}
/* 录入 */
.entry{display:flex;flex-direction:column;gap:12px}
.entry .lbl{font-size:12px;color:var(--muted);margin-bottom:4px}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.who{min-height:22px;font-size:14px;display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:6px}
.who span{background:var(--bg);border-radius:6px;padding:0 6px}
.who .bad{background:var(--orange-l);color:var(--orange)}
.rulebox{font-size:14px;margin-top:6px;min-height:22px}
.preview{border-radius:10px;padding:10px 12px;font-size:14px;background:var(--bg)}
.preview.k{background:var(--orange-l);color:#7A2A08}.preview.j{background:var(--blue-l);color:#1F3A66}
.dated{display:flex;align-items:center;gap:6px}
.dated .inp{flex:1}
.recent .it{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #EEF0F3;font-size:14px}
.recent .it:first-child{border-top:0}
.recent .it .t{flex:1;min-width:0}
/* 手机录入员 */
.rec-body{padding:12px 12px 90px;max-width:640px;margin:0 auto}
.bottomnav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:30}
.bottomnav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);padding:6px 0;cursor:pointer;position:relative}
.bottomnav button.on{color:var(--ink);font-weight:700}
.bottomnav svg{width:22px;height:22px}
.bottomnav .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--orange);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:17px}
/* 列表 */
.list .li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #EEF0F3}
.list .li:first-child{border-top:0}
.list .li .t{flex:1;min-width:0}
.list .li .t b{font-weight:500}
.todo{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:#fff}
.todo .ty{font-size:12px;font-weight:700}
.todo .ty.bad{color:var(--orange)}.todo .ty.good{color:var(--blue)}.todo .ty.warn{color:#8A5300}
.todos{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
/* 弹窗与提示 */
#modal{position:fixed;inset:0;background:rgba(15,20,28,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:0}
#modal .box{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:700px){#modal{align-items:center;padding:20px}#modal .box{border-radius:16px}}
#modal .box.wide{max-width:980px}
#modal h2{margin:0 0 12px;font-size:18px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:200;font-size:14px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.pick button{min-height:40px;border:1px solid var(--line2);border-radius:8px;background:#fff;cursor:pointer;font-size:14px;padding:2px 4px}
.pick button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pick button small{display:block;font-size:11px;color:var(--muted)}
.pick button.on small{color:#C9D1DB}
.codelist .grp{font-size:13px;color:var(--muted);margin:10px 0 4px}
.codelist button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;border:0;border-top:1px solid #EEF0F3;background:#fff;padding:9px 4px;cursor:pointer;font-size:14px}
.codelist button b{width:40px;flex:none}
.codelist button span{flex:1}
.codelist button i{font-style:normal;color:var(--muted);font-size:13px;white-space:nowrap}
.drop{border:2px dashed #B8C1CC;border-radius:12px;padding:22px;text-align:center;cursor:pointer;background:#fff}
.drop.over{border-color:var(--blue);background:var(--blue-l)}
canvas.chart{max-width:100%;height:auto;display:block}
.chartbox{overflow:hidden;border-radius:12px;border:1px solid var(--line);background:#fff}
.honor{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.honor .h{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.honor .h h3{margin:0 0 8px;font-size:15px}
.honor .h div{display:flex;justify-content:space-between;font-size:14px;padding:2px 0}
.setup{max-width:560px;margin:40px auto;padding:16px}
.setup .opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;cursor:pointer}
.setup .opt:hover{border-color:var(--ink)}
.setup .opt b{font-size:17px;display:block;margin-bottom:4px}
.home{max-width:560px;margin:30px auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.mtab{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
/* ===== 打印登记表 ===== */
#print-root{display:none}
.sheet{width:210mm;height:297mm;padding:11mm 12mm 9mm;box-sizing:border-box;background:#fff;color:#000;font-family:var(--font);font-size:10pt;display:flex;flex-direction:column;gap:2.6mm;overflow:hidden;page-break-after:always;break-after:page}
.sheet:last-child{page-break-after:auto;break-after:auto}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:4mm}
.sh-title{font-size:16pt;font-weight:700;letter-spacing:.3pt}
.sh-line{font-size:10.5pt;margin-top:1mm}
.sh-line span{margin-left:4mm}
.sh-box{border:.4mm solid #000;padding:1.2mm 2.5mm;font-size:9.5pt;line-height:1.7;flex:none}
.sh-block{border:.4mm solid #000}
.sh-block.grow{flex:1;display:flex;flex-direction:column;overflow:hidden}
.sh-sec{background:#EDEDED;padding:1mm 2.5mm;font-size:9.5pt;font-weight:700;border-bottom:.25mm solid #000;display:flex;justify-content:space-between;gap:3mm}
.sh-sec em{font-style:normal;font-weight:400}
.sh-t{width:100%;border-collapse:collapse;table-layout:fixed;font-size:9.5pt}
.sh-t td{border:.25mm solid #000;height:7.2mm;padding:0 1.2mm;overflow:hidden}
.sh-t tr td:first-child{border-left:0}.sh-t tr td:last-child{border-right:0}
.sh-t tr:last-child td{border-bottom:0}
.sh-t tr.th td{text-align:center;height:auto;padding:1mm .5mm;font-weight:500;line-height:1.25;border-top:0}
.sh-t tr.th small{display:block;font-size:7pt;font-weight:400}
.sh-t tr.tall td{height:8mm}
.sh-t tr.eg td{color:#555;font-style:italic;text-align:center}
.sh-t td.lb{font-weight:500;font-size:9pt;line-height:1.15}
.sh-t td.sm{font-size:8.5pt}.sh-t td.ct{text-align:center}.sh-t td.lf{text-align:left}.sh-t td.gray{color:#888}
.sh-grid2{width:100%;border-collapse:collapse;font-size:9.5pt}
.sh-grid2 td{border:.25mm solid #000;padding:1.6mm 2.5mm;width:50%}
.sh-grid2 tr td:first-child{border-left:0}.sh-grid2 tr td:last-child{border-right:0}.sh-grid2 tr:first-child td{border-top:0}.sh-grid2 tr:last-child td{border-bottom:0}
.sh-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:4mm;font-size:9.5pt;margin-top:auto}
.sh-note{font-size:8.5pt;color:#333;flex:1}
.sh-legend{border:.4mm solid #000;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6mm 4mm;padding:1.5mm 2.5mm;font-size:9pt}
.sheet.codes{font-size:8.6pt;gap:2mm}
.cd-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3mm}
.cd-cols>div{display:flex;flex-direction:column;gap:2mm}
.cd-box{border:.4mm solid #000}
.cd{display:flex;gap:1.5mm;padding:.35mm 2mm;border-bottom:.15mm solid #ccc;line-height:1.35}
.cd:last-child{border-bottom:0}
.cd b{width:8mm;flex:none}.cd span{flex:1}.cd i{font-style:normal;font-weight:700;flex:none}
.cd-note{border:.4mm solid #000;padding:1.5mm 2.5mm;line-height:1.55}
.cd-names{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:1mm 2mm;gap:0 1mm;line-height:1.5}
.print-preview{background:#9aa3ad;padding:16px;overflow:auto;border-radius:12px;max-height:75vh}
.print-preview .sheet{margin:0 auto 16px;box-shadow:0 4px 16px rgba(0,0,0,.25);transform-origin:top center}
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff}
  body>*:not(#print-root){display:none!important}
  #print-root{display:block!important}
  .sheet{margin:0;box-shadow:none}
}

</style>
</head>
